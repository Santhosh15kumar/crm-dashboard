<div class="app-shell" (keydown.escape)="closeMobileMenu()">
  <app-sidebar [mobileOpen]="mobileMenuOpen()" (navigationSelected)="closeMobileMenu()" />
  @if (mobileMenuOpen()) {
    <button class="sidebar-backdrop" type="button" aria-label="Close navigation" (click)="closeMobileMenu()"></button>
  }
  <div class="app-shell__main" [attr.inert]="mobileMenuOpen() ? '' : null">
    <app-header [menuOpen]="mobileMenuOpen()" [pageTitle]="pageTitle()" (menuClicked)="toggleMobileMenu()" />
    <main class="app-shell__content">
      <router-outlet (activate)="setActivePage($event)" />
    </main>
  </div>
</div>
